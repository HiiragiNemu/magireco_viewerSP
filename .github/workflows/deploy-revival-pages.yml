name: Deploy Magia Record revival preview

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Assemble and validate minimal public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          printf '%s\n' "${GITHUB_SHA}" > _site/build-commit.txt
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          text = Path('_site/index.html').read_text(encoding='utf-8')
          if '<!doctype html>' not in text.lower() or '<script>' not in text:
              raise SystemExit('public preview is missing required HTML/script structure')
          class P(HTMLParser):
              pass
          P().feed(text)
          print(f'validated {len(text):,} characters')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
