name: E2E classic ADV preview

on:
  pull_request:
    branches:
      - master
    paths:
      - "update/e2e-classic-adv-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW: https://validation-classic-adv-runti.magiaexedralive2dviewer.pages.dev
    steps:
      - name: Wait for same-origin model proxy
        shell: bash
        run: |
          set -euo pipefail
          url="$PREVIEW/gamedata/live2d_v4/100100/model.model3.json"
          for attempt in {1..90}; do
            code="$(curl -sS -L --connect-timeout 15 --max-time 30 -D /tmp/headers -o /tmp/model -w '%{http_code}' "$url" || true)"
            echo "attempt=$attempt code=$code"
            if [ "$code" = "200" ] && grep -qi '^x-magia-asset-proxy: r2' /tmp/headers && python - <<'PY'
          from pathlib import Path
          import json
          assert json.loads(Path('/tmp/model').read_text(encoding='utf-8')).get('Version') == 3
          PY
            then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Exercise story catalog and ADV controls
        shell: bash
        run: |
          cat > /tmp/e2e.mjs <<'JS'
          import { chromium } from 'playwright';

          const base = process.env.PREVIEW;
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--autoplay-policy=no-user-gesture-required',
              '--use-angle=swiftshader',
              '--ignore-gpu-blocklist',
            ],
          });
          const context = await browser.newContext({
            viewport: { width: 1600, height: 900 },
          });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          const assetResponses = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', message => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('response', response => {
            const url = response.url();
            if (url.includes('/gamedata/')) assetResponses.push({ url, status: response.status() });
          });

          await page.goto(`${base}/?story=1`, { waitUntil: 'domcontentloaded', timeout: 120000 });
          await page.waitForSelector('#magi-reader-picker[open]', { state: 'visible', timeout: 120000 });
          await page.waitForFunction(() => document.querySelectorAll('#magi-reader-story option').length > 20, null, { timeout: 120000 });

          const storyOptions = await page.locator('#magi-reader-story option').evaluateAll(options =>
            options.map(option => ({ value: option.value, text: option.textContent || '' }))
          );
          const selectedStory = storyOptions.find(option => option.text.includes('101102'))
            || storyOptions.find(option => option.text.includes('1011'))
            || storyOptions[0];
          if (!selectedStory) throw new Error('No story options were loaded');
          await page.selectOption('#magi-reader-story', selectedStory.value);
          await page.waitForFunction(() => document.querySelectorAll('#magi-reader-section option').length > 0);

          const sectionOptions = await page.locator('#magi-reader-section option').evaluateAll(options =>
            options.map(option => ({ value: option.value, text: option.textContent || '' }))
          );
          const selectedSection = sectionOptions.find(option => /101102-7|101102.*7/.test(option.text))
            || sectionOptions[sectionOptions.length - 1];
          if (!selectedSection) throw new Error('No section options were loaded');
          await page.selectOption('#magi-reader-section', selectedSection.value);
          await page.click('#magi-reader-load');

          await page.waitForSelector('body.magireco-adv-mode', { timeout: 120000 });
          await page.waitForSelector('#magireco-adv-stage-ui:not([hidden])', { timeout: 120000 });
          await page.click('#magireco-adv-click-target');

          await page.waitForResponse(response =>
            response.url().includes('/gamedata/live2d_v4/') &&
            response.url().endsWith('/model.model3.json') &&
            response.status() === 200,
            { timeout: 120000 }
          );

          await page.locator('#magireco-adv-auto').check();
          if (!(await page.locator('#magireco-adv-auto').isChecked())) throw new Error('AUTO did not become checked');

          await page.click('#magireco-adv-skip');
          if (await page.getAttribute('#magireco-adv-skip', 'aria-pressed') !== 'true') {
            throw new Error('SKIP did not become active');
          }

          await page.click('#magireco-adv-log-button');
          if (await page.locator('#magireco-adv-log').evaluate(node => node.hidden)) {
            throw new Error('LOG did not open');
          }
          await page.click('#magireco-adv-close-log');
          if (!(await page.locator('#magireco-adv-log').evaluate(node => node.hidden))) {
            throw new Error('LOG did not close');
          }

          for (let index = 0; index < 8; index += 1) {
            await page.click('#magireco-adv-click-target').catch(() => undefined);
            await page.waitForTimeout(500);
          }

          const modelResponses = assetResponses.filter(entry => entry.url.includes('/live2d_v4/'));
          const failedAssets = assetResponses.filter(entry => entry.status >= 400);
          if (!modelResponses.length) throw new Error('No Live2D model responses were observed');
          if (failedAssets.length) throw new Error(`Failed proxied assets: ${JSON.stringify(failedAssets.slice(0, 10))}`);

          const canvasInfo = await page.locator('#live2d-wrapper canvas').first().evaluate(canvas => ({
            width: canvas.width,
            height: canvas.height,
            clientWidth: canvas.clientWidth,
            clientHeight: canvas.clientHeight,
          }));
          if (!canvasInfo.width || !canvasInfo.height || !canvasInfo.clientWidth || !canvasInfo.clientHeight) {
            throw new Error(`Live2D canvas has no drawable size: ${JSON.stringify(canvasInfo)}`);
          }

          await page.screenshot({ path: 'classic-adv-e2e.png', fullPage: true });
          const fatalConsole = consoleErrors.filter(text => !/favicon|404.*effect/i.test(text));
          if (pageErrors.length) throw new Error(`Page errors: ${JSON.stringify(pageErrors)}`);
          if (fatalConsole.length) throw new Error(`Console errors: ${JSON.stringify(fatalConsole.slice(0, 10))}`);

          console.log(JSON.stringify({
            story: selectedStory.text,
            section: selectedSection.text,
            modelResponses: modelResponses.length,
            proxiedResponses: assetResponses.length,
            canvasInfo,
            controls: { auto: true, skip: true, log: true },
          }, null, 2));
          await browser.close();
          JS
          node /tmp/e2e.mjs

      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classic-adv-e2e
          path: classic-adv-e2e.png
          if-no-files-found: ignore
