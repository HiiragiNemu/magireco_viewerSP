name: Check focused classic ADV preview

on:
  pull_request:
    branches:
      - master
    paths:
      - "update/revival-preview-check-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_ORIGIN: https://validation-classic-adv-runti.magiaexedralive2dviewer.pages.dev
    steps:
      - name: Wait for classic ADV page and same-origin asset proxy
        shell: bash
        run: |
          set -euo pipefail
          model_url="$PREVIEW_ORIGIN/gamedata/live2d_v4/200100/model.model3.json"
          voice_url="$PREVIEW_ORIGIN/gamedata/fullvoice/section_101102/vo_full_101102-7-1_hca.hca"
          for attempt in {1..60}; do
            page_code="$(curl --location --silent --show-error --connect-timeout 20 --max-time 45 \
              --output /tmp/page.html --write-out '%{http_code}' "$PREVIEW_ORIGIN/?story=1" || true)"
            model_code="$(curl --location --silent --show-error --connect-timeout 20 --max-time 45 \
              --dump-header /tmp/model.headers --output /tmp/model.body --write-out '%{http_code}' "$model_url" || true)"
            voice_code="$(curl --location --silent --show-error --connect-timeout 20 --max-time 60 \
              --range 0-511 --dump-header /tmp/voice.headers --output /tmp/voice.body --write-out '%{http_code}' "$voice_url" || true)"
            echo "attempt=$attempt page=$page_code model=$model_code voice=$voice_code"
            if [ "$page_code" = "200" ] && [ "$model_code" = "200" ] && { [ "$voice_code" = "200" ] || [ "$voice_code" = "206" ]; }; then
              grep -Eq "Magia Exedra Live2D Viewer|live2d-wrapper|toggleAdvPanelBtn" /tmp/page.html
              grep -qi '^x-magia-asset-proxy: r2' /tmp/model.headers
              grep -qi '^x-magia-asset-proxy: r2' /tmp/voice.headers
              python - <<'PY'
          from pathlib import Path
          import json
          model = json.loads(Path('/tmp/model.body').read_text(encoding='utf-8'))
          assert model.get('Version') == 3
          voice = Path('/tmp/voice.body').read_bytes()
          assert len(voice) >= 8
          assert bytes(value & 0x7f for value in voice[:4]) == b'HCA\x00'
          print('same-origin model and HCA proxy verified')
          PY
              exit 0
            fi
            sleep 10
          done
          echo "Classic preview or /gamedata proxy did not become ready."
          echo '--- page head ---'; head -c 500 /tmp/page.html 2>/dev/null || true
          echo '--- model headers ---'; cat /tmp/model.headers 2>/dev/null || true
          echo '--- voice headers ---'; cat /tmp/voice.headers 2>/dev/null || true
          exit 1
