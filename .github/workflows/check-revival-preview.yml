name: Check full-game revival preview

on:
  pull_request:
    branches:
      - master
    paths:
      - "update/revival-preview-check-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare branch preview
        shell: bash
        run: |
          set -euo pipefail
          url="https://feature-story-playback-local-web-revival.magiaexedralive2dviewer.pages.dev/?story=1"
          for attempt in {1..30}; do
            code="$(curl --location --silent --show-error --connect-timeout 20 --max-time 45 \
              --output /tmp/revival.html --write-out '%{http_code}' "$url" || true)"
            echo "attempt=$attempt status=$code bytes=$(wc -c </tmp/revival.html 2>/dev/null || echo 0)"
            if [ "$code" = "200" ] && grep -Eq "Magia Exedra Live2D Viewer|live2d-wrapper|toggleAdvPanelBtn" /tmp/revival.html; then
              echo "Preview ready: $url"
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become ready."
          test -f /tmp/revival.html && head -c 1000 /tmp/revival.html || true
          exit 1
