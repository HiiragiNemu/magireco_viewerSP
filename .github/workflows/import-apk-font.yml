name: Import verified APK core font

on:
  push:
    branches:
      - public-web-revival
    paths:
      - ".github/workflows/import-apk-font.yml"
      - "update/font-import-trigger.txt"
  pull_request:
    branches:
      - master
    paths:
      - "update/font-import-pr-trigger.txt"
      - "update/font-import-pr-trigger-2.txt"
      - "update/font-import-pr-trigger-final.txt"
      - "update/.font-import-pr"
      - "update/font-import-workflow-context.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-apk-core-font
  cancel-in-progress: true

jobs:
  import-font:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inventory and download public release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/font-sources"
          gh release view latest \
            --repo HiiragiNemu/magireco-cn-patch \
            --json assets \
            --jq '.assets[] | [.name, (.size|tostring)] | @tsv' | tee "$RUNNER_TEMP/font-sources/assets.tsv"
          gh release download latest \
            --repo HiiragiNemu/magireco-cn-patch \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/font-sources" || true
          gh release download latest \
            --repo HiiragiNemu/magireco-cn-patch \
            --pattern "cn_magica_resource.zip" \
            --dir "$RUNNER_TEMP/font-sources" || true
          find "$RUNNER_TEMP/font-sources" -maxdepth 1 -type f -printf '%f\t%s bytes\n'

      - name: Select exact APK font by Git blob identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha1
          from pathlib import Path, PurePosixPath
          from zipfile import BadZipFile, ZipFile
          import os

          EXPECTED = '88afff8991a0a5021f4303d781b346e0ea3758b1'
          root = Path(os.environ['RUNNER_TEMP']) / 'font-sources'
          output = Path(os.environ['RUNNER_TEMP']) / 'mbm_20160902.ttf'

          def git_blob_sha(data: bytes) -> str:
              return sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          candidates = []
          for archive in sorted(root.iterdir()):
              if archive.suffix.lower() not in {'.apk', '.zip'}:
                  continue
              try:
                  with ZipFile(archive) as zf:
                      for name in zf.namelist():
                          if PurePosixPath(name).name != 'mbm_20160902.ttf':
                              continue
                          if name.lower().endswith('.ttf.ttf'):
                              continue
                          data = zf.read(name)
                          if data[:4] not in {b'\x00\x01\x00\x00', b'OTTO', b'true'}:
                              continue
                          candidates.append((archive.name, name, data, git_blob_sha(data)))
              except BadZipFile:
                  print('not a ZIP container:', archive.name)

          for archive, name, data, digest in candidates:
              print(f'candidate: {archive}!/{name} bytes={len(data)} blob={digest}')
          matches = [(archive, name, data) for archive, name, data, digest in candidates if digest == EXPECTED]
          if not matches:
              raise SystemExit(f'expected APK core font blob {EXPECTED} was not found')
          output.write_bytes(matches[0][2])
          print('selected:', matches[0][0], matches[0][1])
          print('selected bytes:', len(matches[0][2]))
          PY

      - name: Checkout public runtime sparsely
        uses: actions/checkout@v4
        with:
          ref: public-web-revival
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            css
          sparse-checkout-cone-mode: true

      - name: Install and verify exact font
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/mbm_20160902.ttf" css/mbm_20160902.ttf
          test "$(git hash-object css/mbm_20160902.ttf)" = "88afff8991a0a5021f4303d781b346e0ea3758b1"
          test ! -e css/mbm_20160902.ttf.ttf

      - name: Commit verified font
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mbm_20160902.ttf
          if git diff --cached --quiet; then
            echo "Verified font is already present."
            exit 0
          fi
          git commit -m "加入 APK 核心中文字体"
          git push origin HEAD:public-web-revival
